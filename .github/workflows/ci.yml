name: CI - Build and Test

# Manual-only trigger. The framework is a template repository — automatic
# CI on every push or PR would burn cycles on user forks and on each
# template instantiation. Maintainers run this explicitly from the
# "Actions" tab when they want a build/test pass.
on:
  workflow_dispatch:
    inputs:
      skip_paddleocr:
        description: 'Skip the pip install of paddleocrserver-powered (faster build, no PaddleOCR available at runtime)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python (only if PaddleOCR install is requested)
        if: ${{ inputs.skip_paddleocr == 'false' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        run: |
          if [ "${{ inputs.skip_paddleocr }}" = "true" ]; then
            mvn -B -ntp install -Pskip-paddleocr
          else
            mvn -B -ntp install
          fi

      - name: Show test summary
        if: always()
        run: |
          if [ -d target/surefire-reports ]; then
            find target/surefire-reports -name "*.txt" -exec cat {} \;
          fi
